name: laundry_manager
description: "Gestion profesional del ciclo de vida de prendas de lavanderia."
publish_to: "none"
version: 1.4.0+6

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.3.0
  riverpod_annotation: ^4.0.2
  hive_flutter: ^1.1.0
  go_router: ^14.2.7
  image_picker: ^1.1.2
  fpdart: ^1.1.0
  uuid: ^4.4.0
  path_provider: ^2.1.3
  http: ^1.2.2
  package_info_plus: ^8.1.3
  open_file: ^3.3.2
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  riverpod_generator: ^4.0.3
  build_runner: ^2.4.9
  mockito: ^5.4.4
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/icon/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#1565C0"
  adaptive_icon_foreground: "assets/icon/icon.png"
